[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "replayseal"
version = "0.1.0"
description = "Privacy-preserving, fail-closed regression replay for agent tool boundaries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lllleolin-max"}]
keywords = ["agents", "replay", "privacy", "regression", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
replayseal = "replayseal.cli:main"

[project.urls]
Repository = "https://github.com/lllleolin-max/replayseal"

[tool.setuptools.packages.find]
where = ["src"]
